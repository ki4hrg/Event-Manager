# Development compose - just the database, run Next.js locally
services:
  db:
    image: postgres:18-alpine
    container_name: event-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_manager
      # PG18 moved the image default to /var/lib/postgresql/18/docker; pin it back
      # to the mounted path so the named volume is actually used (not silently ignored).
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
