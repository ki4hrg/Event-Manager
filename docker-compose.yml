services:
  db:
    image: postgres:18-alpine
    container_name: event-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Read only when the volume is first created. An existing volume keeps the
      # password it was created with, so set this to that value (docs/DEPLOYMENT.md).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: event_manager
      # Recorded exception (docs/DECISIONS.md): the standard mounts PG18 at
      # /var/lib/postgresql; this volume predates that.
      # PG18 moved the image default to /var/lib/postgresql/18/docker; pin it back
      # to the mounted path so the named volume is actually used (not silently ignored).
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE:-ghcr.io/ki4hrg/event-manager:main}
    pull_policy: always
    container_name: event-manager-app
    restart: unless-stopped
    environment:
      # The password travels beside the URL; docker-entrypoint.sh puts it in,
      # percent-encoded (Prisma doesn't read PGPASSWORD itself).
      DATABASE_URL: postgresql://postgres@db:5432/event_manager?schema=public
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # No defaults: a missing secret or URL stops the deploy here, and
      # src/lib/env.ts refuses a short or example secret at boot.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_TRUST_HOST: "true"
      PORT: ${PORT:-3000}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_FROM: ${MAILGUN_FROM:-}
      MAILGUN_BASE_URL: ${MAILGUN_BASE_URL:-https://api.mailgun.net}
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-}
      INBOUND_EMAIL_SECRET: ${INBOUND_EMAIL_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      # node:24-alpine has node (global fetch) but no curl. The entrypoint runs
      # baseline + migrate + seed before `next start`, hence the generous start_period.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
