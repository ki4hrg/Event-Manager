version: 2
updates:
  - package-ecosystem: npm   # package-lock.json
    directory: /
    commit-message:   # Conventional Commit titles, or merge-on-green's title check fails
      prefix: chore
      include: scope
    ignore:   # majors only by hand (non-LTS Node, Postgres data upgrades)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker   # Dockerfile base image
    directory: /
    commit-message:   # Conventional Commit titles, or merge-on-green's title check fails
      prefix: chore
      include: scope
    ignore:   # majors only by hand (non-LTS Node, Postgres data upgrades)
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose   # postgres image in docker-compose.yml
    directory: /
    commit-message:   # Conventional Commit titles, or merge-on-green's title check fails
      prefix: chore
      include: scope
    ignore:   # majors only by hand (non-LTS Node, Postgres data upgrades)
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    commit-message:   # Conventional Commit titles, or merge-on-green's title check fails
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
